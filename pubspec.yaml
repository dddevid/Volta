name: volta
description: Client non ufficiale per il registro elettronico Nuvola (Madisoft)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Network & API
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  
  # State Management
  provider: ^6.1.1
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # UI Components
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  
  # Date & Time
  intl: ^0.19.0
  
  # HTML Rendering & Parsing
  flutter_html: ^3.0.0-beta.2
  html: ^0.15.4
  
  # URL Launcher
  url_launcher: ^6.2.2

  # PDF Viewer
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.1
  
  # Calendar
  table_calendar: ^3.0.9
  
  # Charts (optional)
  fl_chart: ^1.1.1
  flutter_displaymode: ^0.7.0
  google_fonts: ^6.3.2
  animated_bottom_navigation_bar: ^1.4.0
  adaptive_platform_ui: 0.1.103

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icona.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icona.png"

flutter:
  uses-material-design: true
  
  # Uncomment to add assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
